[build-system]
requires = ["setuptools>=77.0.3,<81.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vllm-kv-materialization"
version = "0.1.0"
description = "Standalone vLLM plugin for adaptive KV materialization studies"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []
authors = [
	{name = "caozhe"},
	{name = "xuheng li"},
]

[project.urls]
Repository = "https://github.com/intellistream/vllm-kv-materialization-plugin"
Issues = "https://github.com/intellistream/vllm-kv-materialization-plugin/issues"

[project.scripts]
vllm-kv-materialization-serve = "vllm_kv_materialization.launcher:main"
vllm-kv-materialization-offline = "vllm_kv_materialization.offline_experiment:main"

[project.entry-points."vllm.general_plugins"]
kv_materialization = "vllm_kv_materialization.plugin:register_plugin"

[project.optional-dependencies]
dev = ["build>=1.2", "pytest>=8.0", "ruff>=0.11"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]