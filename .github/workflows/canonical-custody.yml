name: Canonical benchmark custody
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  rebuild-g0:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - run: python -m pytest -q -c /dev/null tests/test_rebuild_g0_release.py tests/test_canonical_evidence.py
      - name: Verify central archive and reproduce published outputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/rebuild_g0_release.py
  rebuild-wavemat:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rebuild summaries from canonical raw bytes and original attestations
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/verify_wavemat_m0_raw_provenance.py
